name: Build NightSight

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project NightSight.xcodeproj \
            -scheme NightSight \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | xcpretty || exit ${PIPESTATUS[0]}

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/NightSight.app Payload/
          zip -qr NightSight.ipa Payload
          ls -lh NightSight.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NightSight-ipa
          path: NightSight.ipa
          retention-days: 30
